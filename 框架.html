<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MindMate</title>
<style>
html,body{margin:0;padding:0;background:#ffffff;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
  font-family:Arial,"Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;color:#000;}
canvas{display:block;touch-action:pan-y;}

/* ===== 房间 ===== */
#room-container{position:relative;width:100%;height:100vh;overflow:hidden;background:#ffffff;}
.scroll-hint{
  position:absolute;bottom:28px;left:50%;transform:translateX(-50%);
  font-size:11px;color:#000;letter-spacing:5px;z-index:10;
  pointer-events:none;transition:opacity .4s;
  background:#fff;border:2px solid #000;padding:6px 16px;
  font-weight:900;text-transform:uppercase;
  box-shadow:3px 3px 0 #000;
  animation:bounce 2s infinite;
}
@keyframes bounce{0%,100%{transform:translate(-50%,0);}50%{transform:translate(-50%,8px);}}

/* ===== 面板容器 ===== */
#scroll-content{background:#ffffff;padding:40px 40px 140px;min-height:100vh;}
.panel{display:none;}
.panel.active{display:block;animation:panelIn .35s ease;}
@keyframes panelIn{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}

/* ===== 卡片（通用） ===== */
.card{
  max-width:600px;margin:0 auto 30px;padding:26px 30px;background:#fff;
  border:2px solid #000;box-shadow:5px 5px 0 #000;
}
.card__title{
  font-size:26px;font-weight:900;color:#000;
  text-transform:uppercase;letter-spacing:2px;
  margin:0 0 14px;display:block;line-height:1.05;
  padding-bottom:12px;border-bottom:2px solid #000;
}
.card__content{font-size:14px;line-height:1.6;color:#000;margin-bottom:16px;font-weight:600;}

/* ===== 通用按钮 ===== */
.action-btn{
  border:2px solid #000;background:#000;color:#fff;
  padding:11px 22px;font-size:13px;font-weight:900;
  text-transform:uppercase;letter-spacing:2px;cursor:pointer;
  font-family:inherit;transition:transform .15s, background .15s, color .15s;
}
.action-btn:hover{background:#fff;color:#000;}
.action-btn:active{transform:scale(.97);}

/* ===== 空白占位 ===== */
.placeholder{
  max-width:600px;margin:0 auto 30px;padding:60px 30px;background:#fff;
  border:2px dashed #000;text-align:center;
  font-size:14px;font-weight:900;letter-spacing:4px;color:#888;
  text-transform:uppercase;
}

/* ===== 右上角导航 ===== */
.topnav{position:fixed;top:14px;right:14px;z-index:60;display:flex;gap:8px;}
.nav-btn{
  padding:9px 15px;background:#fff;color:#000;border:2px solid #000;
  font-size:12px;font-weight:900;letter-spacing:2px;cursor:pointer;font-family:inherit;
  text-transform:uppercase;box-shadow:3px 3px 0 #000;
  transition:transform .15s,box-shadow .15s,background .15s,color .15s;
}
.nav-btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 #000;}
.nav-btn.active{background:#000;color:#fff;}

/* ============ 夜间模式 ============ */
body.night{background:#000;}
body.night #scroll-content{background:#000;}
body.night .card{background:#000;border-color:#fff;box-shadow:5px 5px 0 #fff;}
body.night .card__title{color:#fff;border-bottom-color:#fff;}
body.night .card__content{color:#fff;}
body.night .placeholder{background:#000;border-color:#fff;color:#666;}
body.night .action-btn{background:#fff;color:#000;border-color:#fff;}
body.night .action-btn:hover{background:#000;color:#fff;}
body.night .scroll-hint{background:#000;color:#fff;border-color:#fff;box-shadow:3px 3px 0 #fff;}
body.night .nav-btn{background:#000;color:#fff;border-color:#fff;box-shadow:3px 3px 0 #fff;}
body.night .nav-btn.active{background:#fff;color:#000;}
</style>
</head>
<body>

<div class="topnav">
  <button class="nav-btn active" data-panel="panel-record">Record</button>
  <button class="nav-btn" data-panel="panel-relax">Relax</button>
  <button class="nav-btn" data-panel="panel-sum">Sum</button>
</div>

<div id="room-container">
  <div class="scroll-hint" id="scroll-hint">↓ Scroll</div>
</div>

<div id="scroll-content">
  <div id="panels">

    <section class="panel active" id="panel-record">
      <div class="placeholder">Record · 待完成</div>
    </section>

    <section class="panel" id="panel-relax">
      <div class="placeholder">Relax · 待完成</div>
    </section>

    <section class="panel" id="panel-sum">
      <div class="placeholder">Sum · 待完成</div>
    </section>

  </div>
</div>

<script>
window.addEventListener('error',function(e){
  var d=document.getElementById('__err');
  if(!d){d=document.createElement('div');d.id='__err';
    d.style.cssText='position:fixed;top:0;left:0;right:0;background:#ffd0d0;color:#900;padding:10px;font:12px/1.4 monospace;z-index:99999;white-space:pre-wrap;';
    document.body.appendChild(d);}
  d.textContent+='ERROR: '+e.message+'\n  at '+(e.filename||'')+':'+e.lineno+'\n';
});
if(typeof window.RoomAudio==='undefined'){
  window.RoomAudio={unlock:function(){},sfx:function(){},loop:function(){}};
}
</script>

function makeVine(ang,len,droop,leafSize){
  const pts=[];
  const N=10;
  for(let i=0;i<=N;i++){
    const t=i/N;
    const r=0.14+Math.sin(t*Math.PI*0.65)*len*0.78;
    const y=Math.sin(t*Math.PI*0.5)*0.95 - t*t*droop;
    pts.push(V(Math.cos(ang)*r,y,Math.sin(ang)*r));
  }
  const curve=new THREE.CatmullRomCurve3(pts);
  vineGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(curve.getPoints(22)),MAT));
  for(let i=2;i<=N;i+=2){
    const p=pts[i];
    const leafG=new THREE.Group();
    leafG.position.copy(p);
    leafG.rotation.y=ang+0.4;leafG.rotation.z=-0.35;
    const lp=[];const S=leafSize;
    for(let k=0;k<=10;k++){const t=k/10;const w=Math.sin(t*Math.PI)*S*0.4;lp.push([-w,t*S,0]);}
    for(let k=10;k>=0;k--){const t=k/10;const w=Math.sin(t*Math.PI)*S*0.4;lp.push([w,t*S,0]);}
    leafG.add(loop(lp));
    vineGroup.add(leafG);
  }
}

function lineSegments(o){
  const pos=o.geometry.attributes.position;if(!pos)return null;const arr=[];
  if(o.isLineSegments){for(let i=0;i<pos.count;i++)arr.push(pos.getX(i),pos.getY(i),pos.getZ(i));}
  else if(o.isLine||o.isLineLoop){const n=pos.count;
    for(let i=0;i<n-1;i++)arr.push(pos.getX(i),pos.getY(i),pos.getZ(i),pos.getX(i+1),pos.getY(i+1),pos.getZ(i+1));
    if(o.isLineLoop&&n>2)arr.push(pos.getX(n-1),pos.getY(n-1),pos.getZ(n-1),pos.getX(0),pos.getY(0),pos.getZ(0));
  }else return null;
  return arr;
}
function boldify(root,out){
  const targets=[];
  root.traverse(function(o){if((o.isLine||o.isLineLoop||o.isLineSegments)&&!o.userData.noBold)targets.push(o);});
  targets.forEach(function(o){
    const seg=lineSegments(o);if(!seg||!seg.length)return;
    const g=new THREE.LineSegmentsGeometry();g.setPositions(seg);
    const b=new THREE.LineSegments2(g,o.material===OUTMAT?BOLDMAT_OUT:BOLDMAT);
    b.visible=false;o.add(b);out.push(b);
  });
}
if(BOLDMAT){items.forEach(function(it){if(!it.bold)return;

function pick(e){
  const rect=canvas.getBoundingClientRect();
  ndc.x=((e.clientX-rect.left)/rect.width)*2-1;
  ndc.y=-((e.clientY-rect.top)/rect.height)*2+1;
  ray.setFromCamera(ndc,camera);
  const hits=ray.intersectObjects(proxies,false);
  return hits.length?hits[0].object.userData.it:null;
}
function setHover(it){
  if(hovered===it)return;
  if(hovered)hovered.boldClones.forEach(function(b){b.visible=false;});

  if(hovered)hovered.boldClones.forEach(function(b){b.visible=true;});
  canvas.style.cursor=it?'pointer':'';
}

const lightState={night:false,switchOn:false};
function updateLight(){
  const d=new Date();const h=d.getHours()+d.getMinutes()/60;
  lightState.night=(h>=19||h<7);
  document.body.classList.toggle('night', lightState.night);
  const roomNight=lightState.night&&!lightState.switchOn;
  scene.background.set(roomNight?0x000000:0xffffff);
  MAT.color.set(roomNight?0xffffff:0x000000);
  FILL.color.set(roomNight?0x000000:0xffffff);
  if(BOLDMAT)BOLDMAT.color.set(roomNight?0xffffff:0x000000);
  if(BOLDMAT_OUT)BOLDMAT_OUT.color.set(lightState.night?0xffffff:0x000000);
  OUTFILL.color.set(lightState.night?0x000000:0xffffff);
  OUTMAT.color.set(lightState.night?0xffffff:0x000000);
}
const coneA=new THREE.Vector3(-3.0,2.05,-4.7);
const conePlanes=[];
for(let k=0;k<24;k++){
  const ph=k*Math.PI/12;
  const n=new THREE.Vector3(Math.cos(ph)*1.3,-2.05,Math.sin(ph)*1.3).normalize();
  const pl=new THREE.Plane(n,-n.dot(coneA));
  pl.userData={c:-n.dot(coneA)};conePlanes.push(pl);
}
MAT.clippingPlanes=conePlanes;FILL.clippingPlanes=conePlanes;
function setClip(on){for(const p of conePlanes)p.constant=on?p.userData.c:1e10;}
setClip(false);
function renderNightLit(){
  const BG=scene.background;
  setClip(false);renderer.autoClear=true;renderer.render(scene,camera);
  setClip(true);renderer.autoClear=false;scene.background=null;
  MAT.color.set(0x000000);FILL.color.set(0xffffff);
  renderer.render(scene,camera);
  MAT.color.set(0xffffff);FILL.color.set(0x000000);
  setClip(false);scene.background=BG;
}

const clockT=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clockT.getDelta(),0.05),t=clockT.elapsedTime;
  for(const it of items){
    if(it.p<it.target) it.p=Math.min(it.target,it.p+dt*it.rate);
    else if(it.p>it.target) it.p=Math.max(it.target,it.p-dt*it.rate);
    if(it.apply) it.apply(it,dt,t);
  }
  updateLight();
  if(lightState.night&&!lightState.switchOn&&lampIt.p>0.55) renderNightLit();
  else{renderer.autoClear=true;renderer.render(scene,camera);}
}
animate();
