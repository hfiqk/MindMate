function buildCurtain(w,n){
  const g=new THREE.Group();
  const fold=t=>Math.sin(t*Math.PI*3.2)*0.045;
  for(let i=0;i<=n;i++){
    const t=i/n, zz=t*w, dx=fold(t);
    g.add(line([[dx,0,zz],[dx,-2.75,zz]]));

  for(let i=0;i<=n;i++){const t=i/n,zz=t*w,dx=fold(t);top.push([dx,0,zz]);bot.push([dx,-2.75,zz]);}
  g.add(line(top)); g.add(line(bot));
  return g;
}

function makeVine(ang,len,droop,leafSize){
  const pts=[];
  const N=10;
  for(let i=0;i<=N;i++){
    const t=i/N;
    const r=0.14+Math.sin(t*Math.PI*0.65)*len*0.78;
    const y=Math.sin(t*Math.PI*0.5)*0.95 - t*t*droop;
    pts.push(V(Math.cos(ang)*r,y,Math.sin(ang)*r));
  }
  const curve=new THREE.CatmullRomCurve3(pts);
  vineGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(curve.getPoints(22)),MAT));
  for(let i=2;i<=N;i+=2){
    const p=pts[i];
    const leafG=new THREE.Group();
    leafG.position.copy(p);
    leafG.rotation.y=ang+0.4;
    leafG.rotation.z=-0.35;
    const lp=[];
    const S=leafSize;
    for(let k=0;k<=10;k++){const t=k/10;const w=Math.sin(t*Math.PI)*S*0.4;lp.push([-w,t*S,0]);}
    for(let k=10;k>=0;k--){const t=k/10;const w=Math.sin(t*Math.PI)*S*0.4;lp.push([w,t*S,0]);}
    leafG.add(loop(lp));
    vineGroup.add(leafG);
  }
}

const items=[],proxies=[];
function proxy(w,h,d,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),HIDE);m.position.set(x,y,z);return m;}
function mkItem(px,cfg){
  const it=Object.assign({p:0,target:0,rate:1.6,v:0,tv:0,apply:null,action:null,bold:null,boldClones:[]},cfg);
  if(!it.action) it.action=function(){it.target=it.target?0:1;};
  (Array.isArray(px)?px:[px]).forEach(function(m){m.userData.it=it;scene.add(m);proxies.push(m);});
  items.push(it); return it;
}

/* ---------------- 悬停加粗 ---------------- */
let BOLDMAT=null,BOLDMAT_OUT=null;
if(THREE.LineSegments2&&THREE.LineSegmentsGeometry&&THREE.LineMaterial){
  BOLDMAT=new THREE.LineMaterial({color:0x000000,linewidth:1.5});
  BOLDMAT.resolution.set(window.innerWidth,window.innerHeight);
  BOLDMAT.polygonOffset=true;BOLDMAT.polygonOffsetFactor=-2;BOLDMAT.polygonOffsetUnits=-2;
  BOLDMAT_OUT=new THREE.LineMaterial({color:0x000000,linewidth:1.5});
  BOLDMAT_OUT.resolution.set(window.innerWidth,window.innerHeight);
  BOLDMAT_OUT.polygonOffset=true;BOLDMAT_OUT.polygonOffsetFactor=-2;BOLDMAT_OUT.polygonOffsetUnits=-2;
}
function lineSegments(o){
  const pos=o.geometry.attributes.position;
  if(!pos)return null;
  const arr=[];
  if(o.isLineSegments){
    for(let i=0;i<pos.count;i++) arr.push(pos.getX(i),pos.getY(i),pos.getZ(i));
  }else if(o.isLine||o.isLineLoop){
    const n=pos.count;
    for(let i=0;i<n-1;i++) arr.push(pos.getX(i),pos.getY(i),pos.getZ(i),pos.getX(i+1),pos.getY(i+1),pos.getZ(i+1));
    if(o.isLineLoop&&n>2) arr.push(pos.getX(n-1),pos.getY(n-1),pos.getZ(n-1),pos.getX(0),pos.getY(0),pos.getZ(0));
  }else return null;
  return arr;
}
function boldify(root,out){
  const targets=[];
  root.traverse(function(o){
    if((o.isLine||o.isLineLoop||o.isLineSegments)&&!o.userData.noBold) targets.push(o);
  });
  targets.forEach(function(o){
    const seg=lineSegments(o);
    if(!seg||!seg.length)return;
    const g=new THREE.LineSegmentsGeometry();
    g.setPositions(seg);
    const b=new THREE.LineSegments2(g,o.material===OUTMAT?BOLDMAT_OUT:BOLDMAT);
    b.visible=false;
    o.add(b);
    out.push(b);
  });
}
if(BOLDMAT){
  items.forEach(function(it){
    if(!it.bold)return;
    (Array.isArray(it.bold)?it.bold:[it.bold]).forEach(function(r){boldify(r,it.boldClones);});
  });
}

/* ---------------- 拾取 + 悬停 ---------------- */
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
let hovered=null;
function pick(e){
  ndc.x=(e.clientX/window.innerWidth)*2-1;
  ndc.y=-(e.clientY/window.innerHeight)*2+1;
  ray.setFromCamera(ndc,camera);
  const hits=ray.intersectObjects(proxies,false);
  return hits.length?hits[0].object.userData.it:null;
}
function setHover(it){
  if(hovered===it)return;
  if(hovered)hovered.boldClones.forEach(function(b){b.visible=false;});
  hovered=it;
  if(hovered)hovered.boldClones.forEach(function(b){b.visible=true;});
  document.body.style.cursor=it?'pointer':'';
}
window.addEventListener('pointerdown',function(){RoomAudio.unlock();});
window.addEventListener('pointerdown',function(e){const it=pick(e);if(it&&it.action)it.action(it);});
window.addEventListener('pointermove',function(e){setHover(pick(e));});
window.addEventListener('pointerleave',function(){setHover(null);});
window.addEventListener('resize',function(){
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
  if(BOLDMAT)BOLDMAT.resolution.set(window.innerWidth,window.innerHeight);
  if(BOLDMAT_OUT)BOLDMAT_OUT.resolution.set(window.innerWidth,window.innerHeight);
});

/* ---------------- 光照系统 ---------------- */
const lightState={night:false,switchOn:false};
function updateLight(){
  const d=new Date();
  const h=d.getHours()+d.getMinutes()/60;
  lightState.night=(h>=19||h<7);
  const roomNight=lightState.night&&!lightState.switchOn;
  scene.background.set(roomNight?0x000000:0xffffff);
  MAT.color.set(roomNight?0xffffff:0x000000);
  FILL.color.set(roomNight?0x000000:0xffffff);
  if(BOLDMAT)BOLDMAT.color.set(roomNight?0xffffff:0x000000);
  if(BOLDMAT_OUT)BOLDMAT_OUT.color.set(lightState.night?0xffffff:0x000000);
  OUTFILL.color.set(lightState.night?0x000000:0xffffff);
  OUTMAT.color.set(lightState.night?0xffffff:0x000000);
  const wOpen=windowIt.p>0.4;
  RoomAudio.loop('dayAmb',!lightState.night&&wOpen);
  RoomAudio.loop('nightAmb',lightState.night&&wOpen);
  RoomAudio.loop('hum',lightState.night&&lightState.switchOn);
}

/* 落地灯锥形光域 */
const coneA=new THREE.Vector3(-3.0,2.05,-4.7);
const conePlanes=[];
for(let k=0;k<24;k++){
  const ph=k*Math.PI/12;
  const n=new THREE.Vector3(Math.cos(ph)*1.3,-2.05,Math.sin(ph)*1.3).normalize();
  const pl=new THREE.Plane(n,-n.dot(coneA));
  pl.userData={c:-n.dot(coneA)};
  conePlanes.push(pl);
}
MAT.clippingPlanes=conePlanes;
FILL.clippingPlanes=conePlanes;
function setClip(on){for(const p of conePlanes)p.constant=on?p.userData.c:1e10;}
setClip(false);
function renderNightLit(){
  const BG=scene.background;
  setClip(false);
  renderer.autoClear=true;
  renderer.render(scene,camera);
  setClip(true);
  renderer.autoClear=false;
  scene.background=null;
  MAT.color.set(0x000000);FILL.color.set(0xffffff);
  renderer.render(scene,camera);
  MAT.color.set(0xffffff);FILL.color.set(0x000000);
  setClip(false);
  scene.background=BG;
}

RoomAudio.loop('chimes',true);
RoomAudio.loop('plantSway',true);

/* ---------------- 主循环 ---------------- */
const clockT=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clockT.getDelta(),0.05),t=clockT.elapsedTime;
  for(const it of items){
    if(it.p<it.target) it.p=Math.min(it.target,it.p+dt*it.rate);
    else if(it.p>it.target) it.p=Math.max(it.target,it.p-dt*it.rate);
    it.v+=(it.tv-it.v)*Math.min(1,dt*2.2);
    if(it.apply) it.apply(it,dt,t);
  }
  updateLight();
  if(lightState.night&&!lightState.switchOn&&lampIt.p>0.55) renderNightLit();
  else{renderer.autoClear=true;renderer.render(scene,camera);}
}
animate();
})();
